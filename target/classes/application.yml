server:
  port: 8080

spring:
  cassandra:
    contact-points: www.wyzzdn.top # Cassandra 集群节点地址（可配置多个，用逗号分隔）
    port: 21053 # 端口号
    local-datacenter: datacenter1 # 必须与集群配置的数据中心名称一致（大小写敏感）
  ai:
    deepseek:
      api-key: sk-c877a5a8fa2348b9acd5a2f00d190092
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.8
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:1.7b
          temperature: 0.7
    zhipuai:
      base-url: https://open.bigmodel.cn/api/paas
      api-key: f833526465674b359c07f8ea0ed3b5d1.xCNCffN3M2tFPaMS
      chat:
        options:
          model: glm-4-air
          temperature: 0.7
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: sk-ecd116c5b63341f9a65a297d964adff7
      chat:
        options:
          model: qwen-turbo
          temperature: 0.7
    chat:
      memory:
        repository:
          cassandra:
            keyspace: gchong3068_ai_robot # 指定存储聊天记忆的 Keyspace（类似数据库名）
            table: t_ai_chat_memory # 表名
            time-to-live: 1095d # 数据的自动过期时间（1095天 ≈ 3年）
            initialize-schema: true  # 自动初始化表结构





logging:
  level:
    org.springframework.ai.chat.client.advisor: debug